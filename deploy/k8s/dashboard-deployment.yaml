apiVersion: apps/v1
kind: Deployment
metadata:
  name: cement-copilot-dashboard
  labels:
    app: cement-copilot-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cement-copilot-dashboard
  template:
    metadata:
      labels:
        app: cement-copilot-dashboard
    spec:
      containers:
        - name: dashboard
          image: cement-kiln-copilot-dashboard:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: API_BASE_URL
              value: "http://cement-copilot-api:8000"
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "192Mi"
