# ===========================================================================
# Primary training configuration: burning-zone temperature, 75 min ahead.
#
#     python -m src.ml.train --config config/model_config.yaml
#
# The advisor (src.ml.advisor) uses this model as a *constraint*: it lowers
# fuel (the specific-heat KPI) only as far as the predicted burning-zone
# temperature stays inside the safety envelope. CI trains it on the simulated
# demo plant (scripts/train_demo_model.sh) and gates its validation RMSE.
#
# DATABASE_URL comes from the environment (.env.example); no credentials here.
# ===========================================================================

target_tag: "BZ_TEMP_C"

# Manipulated variables and measured disturbances only. Intermediate outcomes
# (O2, CO) are deliberately excluded: the advisor changes the manipulated
# variables, and an input that is itself a consequence of them would be held
# fixed in what-if scoring and mislead the model.
input_tags:
  - "BZ_TEMP_C"               # autoregressive history
  - "SPECIFIC_HEAT_KCAL_KG"   # derived KPI: fuel fired per kg clinker
  - "ID_FAN_PCT"
  - "GAS_HEAT_SHARE"          # derived KPI: gas vs mazut flame
# Deliberately few inputs: every extra input that drifts outside its training
# range (feed, kiln speed) cost out-of-sample accuracy on the demo plant.

# Standardized ridge regression: deterministic on every machine (CI baseline),
# and it extrapolates a gain linearly instead of flattening like a tree model.
estimator: ridge

# "auto": estimate each input's transport delay (src.ml.delays) and add the
# matching lag on top of base_lags.
lags: auto
base_lags: [1, 3]
max_delay_rows: 18            # 90 min on the 5-min grid
delay_diff_rows: 6            # correlate 30-min changes (kiln response is slow)

# Learn the change of BZT over the horizon on top of its current value: the
# level drifts with raw-mix burnability, and tree models cannot extrapolate
# a level they have not seen, but the change is well inside the training range.
target_mode: delta

rolling_windows: [6]
horizon: 15                   # 75 min: dead time (~20 min) + ~2 time constants,
                              # so the forecast sees most of a setpoint move's effect
conformal_alpha: 0.1          # 90 % prediction intervals

plant_config: "config/plant.yaml"
model_output_path: "artifacts/models/bz_temp_model.joblib"
