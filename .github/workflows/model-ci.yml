name: model-ci

on:
  push:
  pull_request:

jobs:
  model-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff

      - name: Lint (pyflakes rules)
        run: ruff check src tests

      - name: Run tests
        run: pytest -v --durations=15

      - name: Train every demo model on the simulated plant
        env:
          DATABASE_URL: sqlite:///./cement_copilot_ci.db
          MLFLOW_TRACKING_URI: ./mlruns
        run: ./scripts/train_demo_model.sh

      - name: Fail if the demo metric regresses past the committed baseline
        run: python -m src.ml.check_baseline
